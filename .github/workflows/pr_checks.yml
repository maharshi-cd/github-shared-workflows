---
name: 'PR Validation'
on:
  workflow_call:
    inputs:
      types:
        required: false
        type: string
        default: |
          fix
          feat
          docs
          ci
          chore
          test
          refactor
          style
          perf
          build
          revert
      requireScope:
        required: false
        type: boolean
        default: false
      subjectPattern:
        required: false
        type: string
        default: '^[A-Z].+$'
      validateSingleCommit:
        required: false
        type: boolean
        default: false
      checkLabels:
        required: false
        type: boolean
        default: true

jobs:
  validate-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: ${{ inputs.types }}
          requireScope: ${{ inputs.requireScope }}
          subjectPattern: ${{ inputs.subjectPattern }}
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            starts with an uppercase character.
          wip: true
          validateSingleCommit: ${{ inputs.validateSingleCommit }}
          scopes: |
            *

      - name: Check PR labels
        if: ${{ inputs.checkLabels }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(gh api repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/labels --jq '.[].name')" ]; then
            echo "::error::No labels found on this PR. Please add at least one label."
            exit 1
          else
            echo "PR has labels, validation passed."
          fi

  validate-commits:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Validate Commit Messages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TYPES="${{ inputs.types }}"
          TYPES_REGEX=$(echo "$TYPES" | tr '\n' '|' | sed 's/|$//' | sed 's/||*/|/g' | tr -d ' ')
          PATTERN="^(${TYPES_REGEX})(\([^)]+\))?(!)?: .+"

          echo "ℹ️ Checking commit messages against pattern: $PATTERN"
          echo ""

          COMMITS=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/commits" \
            --jq '.[].commit.message | split("\n")[0]')

          FAILED=0
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            echo "$msg" | grep -qE "^Merge " && echo "  ⏭️ Skipped (merge): $msg" && continue

            if echo "$msg" | grep -qPi "$PATTERN"; then
              echo "  ✅ $msg"
            else
              echo "  🚩 $msg"
              FAILED=1
            fi
          done <<< "$COMMITS"

          echo ""
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::🚫 Some commit messages don't follow the Conventional Commits specification."
            exit 1
          fi
          echo "✅ All commits follow the Conventional Commits specification."
...